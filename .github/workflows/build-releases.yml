name: build-releases

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            archive_name: Deep-Live-Cam-Windows-x64.zip
          - label: linux-x64
            os: ubuntu-22.04
            archive_name: Deep-Live-Cam-Linux-x64.tar.gz
          - label: macos-x64
            os: macos-15-intel
            archive_name: Deep-Live-Cam-macOS-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libegl1 libxkbcommon-x11-0

      - name: Install Python dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build application bundle
        run: pyinstaller --noconfirm --clean packaging/deep_live_cam.spec

      - name: Package Windows x64 archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Deep-Live-Cam/* -DestinationPath ${{ matrix.archive_name }}

      - name: Package Linux x64 archive
        if: runner.os == 'Linux'
        run: |
          cp packaging/linux/deep-live-cam.desktop dist/Deep-Live-Cam/
          cp assets/icons/linux/app_icon.png dist/Deep-Live-Cam/deep-live-cam.png
          tar -czf ${{ matrix.archive_name }} -C dist Deep-Live-Cam

      - name: Package macOS x64 archive
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/Deep-Live-Cam.app ${{ matrix.archive_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.archive_name }}

  build-android:
    name: Build android-apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Android Release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk ../Deep-Live-Cam-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: Deep-Live-Cam-Android.apk

  publish-release:
    needs: [build-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
